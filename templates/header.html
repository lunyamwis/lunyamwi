<header class="de-navbar {% if request.resolver_match.url_name != 'home' %}de-navbar--scrolled{% endif %} {% if request.resolver_match.url_name == 'home' %}de-navbar--home{% endif %}" id="de-navbar">
  <div class="container">
    <nav class="navbar navbar-expand-lg p-0">

      <a href="/" class="navbar-brand de-navbar__brand">
        <span class="de-brand-dot"></span>Data Consultant<span class="de-brand-accent">.</span>
      </a>

      <button class="navbar-toggler de-navbar__toggler" type="button" data-toggle="collapse" data-target="#deNav"
              aria-controls="deNav" aria-expanded="false" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>

      <div class="collapse navbar-collapse" id="deNav">
        <ul class="navbar-nav ml-auto align-items-lg-center">
          <li class="nav-item">
            <a href="/" class="nav-link de-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
          </li>
          <li class="nav-item">
            <a href="{% url 'home' %}#skills" class="nav-link de-nav-link">Skills</a>
          </li>
          <li class="nav-item">
            <a href="{% url 'home' %}#projects" class="nav-link de-nav-link">Projects</a>
          </li>
          <li class="nav-item">
            <a href="{% url 'post-list' %}" class="nav-link de-nav-link {% if request.resolver_match.url_name == 'post-list' %}active{% endif %}">Blog</a>
          </li>
          <li class="nav-item">
            <a href="{% url 'home' %}#contact" class="nav-link de-nav-link">Contact</a>
          </li>
          {% if request.user.is_staff %}
          <li class="nav-item">
            <a href="{% url 'post-create' %}" class="nav-link de-nav-link">
              <i class="fa fa-plus-circle mr-1"></i>New Post
            </a>
          </li>
          {% endif %}
        </ul>

        <div class="ml-lg-3 mt-3 mt-lg-0">
          <form action="{% url 'search' %}" class="d-flex" role="search">
            <input type="search" name="q" class="de-search-input" placeholder="Search articles…" autocomplete="off">
            <button type="submit" class="de-search-btn"><i class="fa fa-search"></i></button>
          </form>
        </div>
      </div>

    </nav>
  </div>
</header>

<script>
/* Home page: transparent until scrolled. All other pages: always solid (set server-side). */
(function () {
  var nav = document.getElementById("de-navbar");
  if (!nav.classList.contains("de-navbar--home")) return;
  window.addEventListener("scroll", function () {
    nav.classList.toggle("de-navbar--scrolled", window.scrollY > 60);
  });
})();
</script>
