worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 50m;

    upstream django {
        server web:8000;
    }

    # ======================================================
    # HTTP (port 80) – Certbot + redirect to HTTPS
    # ======================================================
    server {
        listen 80;
        server_name lunyamwi.org www.lunyamwi.org;

        # Certbot challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ======================================================
    # HTTPS (port 443) – Main site
    # ======================================================
    server {
        listen 443 ssl http2;
        server_name lunyamwi.org www.lunyamwi.org;

        ssl_certificate     /etc/letsencrypt/live/lunyamwi.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lunyamwi.org/privkey.pem;

        # Modern TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Static files
        location /static/ {
            alias /static/;
            expires 30d;
            access_log off;
            add_header Cache-Control "public";
        }

        # Django app
        location / {
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 300;
            proxy_connect_timeout 60;

            proxy_pass http://django;
        }
    }
}
